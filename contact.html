<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact – TechAI Blog</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .page-hero { background: var(--dark); color: white; padding: 56px 0; text-align: center; }
    .page-hero h1 { font-family: var(--font-serif); font-size: 2.2rem; margin-bottom: 8px; }
    .page-hero p  { color: #94a3b8; }
    .contact-wrap { max-width: 600px; margin: 48px auto; padding: 0 24px 64px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group label { font-size: .875rem; font-weight: 600; color: var(--dark); }
    .form-group input, .form-group textarea, .form-group select {
      padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: .9rem; outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 130px; }
    .submit-btn { width: 100%; padding: 12px; font-size: 1rem; }
  </style>
</head>
<body>
  <header class="header" id="header">
    <div class="container nav-container">
      <a href="index.html" class="logo"><i class="fas fa-robot logo-icon"></i><span><strong>TechAI</strong> Blog</span></a>
      <nav class="nav" id="nav">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="write.html" class="btn btn-primary">Write a Post</a>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1>Get in Touch</h1>
      <p>Have a question, tip, or want to contribute? We'd love to hear from you.</p>
    </div>
  </section>

  <div class="contact-wrap">
    <form id="contactForm">
      <div class="form-group">
        <label for="cName">Full Name</label>
        <input type="text" id="cName" placeholder="Your name" required/>
      </div>
      <div class="form-group">
        <label for="cEmail">Email Address</label>
        <input type="email" id="cEmail" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label for="cSubject">Subject</label>
        <select id="cSubject">
          <option>General Inquiry</option>
          <option>Guest Post</option>
          <option>Advertising</option>
          <option>Technical Issue</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="cMessage">Message</label>
        <textarea id="cMessage" placeholder="Tell us more…" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary submit-btn">Send Message</button>
    </form>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-copy">© 2025 TechAI Blog. All rights reserved.</p>
      <nav class="footer-links"><a href="#">Privacy Policy</a><a href="#">Terms of Service</a></nav>
      <div class="footer-social">
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      showToast('✓ Message sent! We\'ll get back to you soon.');
      this.reset();
    });
  </script>
</body>
</html>
